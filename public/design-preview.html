<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guardr — Full Site Design Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #6B8F6E;
      --brand-primary-bright: #9AE09F;
      --brand-primary-hover: #5A7A5D;
      --brand-bg: #000000;
      --brand-surface: #000000;
      --brand-elevated: #080808;
      --brand-border: #1A2A1A;
      --brand-text: #7DB882;
      --brand-text-muted: #3D5C40;
      --brand-on-primary: #000000;
      --chrome: #000000;
      --status-warning: #C9A24D;
      --glow: 0 0 24px color-mix(in srgb, var(--brand-primary-bright) 65%, transparent);
      --glow-strong: 0 0 40px color-mix(in srgb, var(--brand-primary-bright) 85%, transparent), 0 0 80px color-mix(in srgb, var(--brand-primary-bright) 35%, transparent);
      --radius-card: 16px;
      --radius-pill: 999px;
      --index-w: 272px;
    }
    * { box-sizing: border-box; margin: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: #000;
      color: var(--brand-text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Preview chrome ── */
    .preview-chrome {
      position: sticky; top: 0; z-index: 300;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px;
      background: #000;
      border-bottom: 1px solid var(--brand-border);
    }
    .preview-chrome h1 { font-size: 14px; font-weight: 800; }
    .preview-chrome p { font-size: 11px; color: var(--brand-text-muted); }
    .toolbar { display: flex; gap: 5px; flex-wrap: wrap; }
    .toolbar button {
      font: 600 11px/1 "Plus Jakarta Sans", sans-serif;
      padding: 7px 11px; border-radius: var(--radius-pill); cursor: pointer;
      border: 1px solid var(--brand-border); background: #000; color: var(--brand-text-muted); transition: .2s;
    }
    .toolbar button.active { border-color: var(--brand-primary-bright); color: var(--brand-primary-bright); box-shadow: var(--glow); }
    .toolbar button.role-btn.active { background: color-mix(in srgb, var(--brand-primary-bright) 12%, transparent); }

    /* ── Page index sidebar (keep structure, Uber polish) ── */
    .page-index {
      position: sticky; top: 52px; align-self: flex-start;
      width: var(--index-w); max-height: calc(100vh - 52px);
      overflow-y: auto; flex-shrink: 0;
      border-right: 1px solid var(--brand-border);
      background: #000;
      padding: 0 0 40px;
      scrollbar-width: thin;
    }
    .index-brand {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--brand-border);
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 800; letter-spacing: -.03em;
    }
    .index-brand .logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      display: grid; place-items: center; font-size: 13px; font-weight: 800;
      box-shadow: var(--glow);
    }
    .index-brand small { display: block; font-size: 10px; font-weight: 600; color: var(--brand-text-muted); margin-top: 2px; }
    .index-group { margin-bottom: 8px; padding-top: 10px; }
    .index-group-title {
      padding: 4px 18px 8px;
      font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: var(--brand-text-muted);
    }
    .index-link {
      position: relative;
      display: block; width: 100%; text-align: left;
      padding: 9px 18px; border: none; background: none;
      font: 600 13px/1.25 "Plus Jakarta Sans", sans-serif;
      color: var(--brand-text-muted); cursor: pointer; transition: .15s;
    }
    .index-link:hover { color: var(--brand-text); background: color-mix(in srgb, var(--brand-primary) 7%, transparent); }
    .index-link.active {
      color: var(--brand-text);
      background: color-mix(in srgb, var(--brand-primary-bright) 8%, transparent);
    }
    .index-link.active::before {
      content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px;
      background: var(--brand-primary-bright); border-radius: 0 3px 3px 0; box-shadow: var(--glow);
    }
    .index-link .path { display: block; font-size: 10px; font-weight: 500; color: var(--brand-text-muted); opacity: .85; margin-top: 3px; }
    .index-link.active .path { color: var(--brand-primary-bright); opacity: .7; }

    .scroll-stage { flex: 1; padding: 24px 28px 100px; min-width: 0; background: #000; }

    .site-layout { display: flex; min-height: calc(100vh - 52px); }

    /* ── Screen blocks ── */
    .screen-block {
      margin-bottom: 48px;
      scroll-margin-top: 68px;
    }
    .screen-meta {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .screen-meta h2 { font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
    .screen-meta .role-tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
      padding: 3px 8px; border-radius: var(--radius-pill);
      border: 1px solid var(--brand-border); color: var(--brand-text-muted);
    }
    .screen-meta .path-tag { font-size: 11px; color: var(--brand-primary-bright); font-weight: 600; }

    .device-frame {
      margin: 0 auto;
      border: 1px solid var(--brand-border);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 32px 100px rgba(0,0,0,.85), inset 0 1px 0 color-mix(in srgb, var(--brand-primary-bright) 5%, transparent);
      background: var(--brand-bg);
      transition: max-width .3s;
    }
    .device-frame.desktop { max-width: 1100px; }
    .device-frame.tablet { max-width: 820px; }
    .device-frame.mobile { max-width: 390px; border-radius: 28px; }

    /* ── Uber Pro app shell ── */
    .shell { display: flex; min-height: 680px; background: var(--brand-bg); }
    .shell.mobile-stack { flex-direction: column; min-height: 740px; }
    .shell-sidebar {
      width: 228px; flex-shrink: 0;
      border-right: 1px solid var(--brand-border);
      padding: 18px 0 14px; display: flex; flex-direction: column;
      background: #000;
    }
    .shell-brand {
      padding: 0 20px 22px; font-size: 15px; font-weight: 800; letter-spacing: -.04em;
      display: flex; align-items: center; gap: 10px; color: var(--brand-text);
    }
    .shell-brand .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      display: grid; place-items: center; font-size: 13px; font-weight: 800;
      box-shadow: var(--glow);
    }
    .shell-nav { display: flex; flex-direction: column; gap: 1px; flex: 1; overflow-y: auto; }
    .shell-nav-group { margin-bottom: 14px; }
    .shell-nav-group-title {
      padding: 0 20px 6px; font-size: 9px; font-weight: 800;
      letter-spacing: .1em; text-transform: uppercase; color: var(--brand-text-muted);
    }
    .shell-nav button {
      position: relative; display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 12px 20px; border: none; background: none;
      font: 600 13px/1 "Plus Jakarta Sans", sans-serif;
      color: var(--brand-text-muted); cursor: default; text-align: left;
    }
    .shell-nav button .ico { width: 18px; text-align: center; font-size: 14px; opacity: .9; }
    .shell-nav button.on {
      color: var(--brand-text);
      background: color-mix(in srgb, var(--brand-primary-bright) 8%, transparent);
    }
    .shell-nav button.on::before {
      content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 4px;
      background: var(--brand-primary-bright); border-radius: 0 4px 4px 0; box-shadow: var(--glow);
    }
    .shell-status {
      margin: 8px 14px 0; padding: 12px 14px; border-radius: 12px;
      background: var(--brand-elevated); border: 1px solid var(--brand-border);
    }
    .shell-status-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand-text-muted); }
    .shell-status-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12px; font-weight: 700; }
    .shell-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-primary-bright); box-shadow: var(--glow); }

    .shell-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .uber-topbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 20px;
      background: color-mix(in srgb, #000 92%, transparent);
      backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid var(--brand-border);
    }
    .uber-market {
      font: 700 12px/1 "Plus Jakarta Sans", sans-serif;
      padding: 8px 14px; border-radius: var(--radius-pill);
      border: 1px solid var(--brand-border); background: var(--brand-elevated);
      color: var(--brand-text);
    }
    .uber-ticker {
      flex: 1; min-width: 120px; overflow: hidden;
      font-size: 11px; font-weight: 500; color: var(--brand-text-muted);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      white-space: nowrap;
    }
    .uber-ticker strong { color: var(--status-warning); font-weight: 800; }
    .uber-top-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .uber-bell { position: relative; font-size: 16px; }
    .uber-bell-badge {
      position: absolute; top: -5px; right: -7px;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      font-size: 9px; font-weight: 800; border-radius: var(--radius-pill);
      display: grid; place-items: center;
    }
    .uber-greeting { font-size: 13px; font-weight: 700; }
    .uber-greeting span { color: var(--brand-text-muted); font-weight: 500; }
    .uber-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--brand-primary-bright);
      background: var(--brand-elevated); box-shadow: var(--glow);
    }
    .shell-subnav {
      display: flex; gap: 2px; padding: 0 20px;
      border-bottom: 1px solid var(--brand-border); background: #000;
      overflow-x: auto;
    }
    .shell-subnav button {
      padding: 12px 14px; border: none; background: none;
      font: 600 12px/1 "Plus Jakarta Sans", sans-serif;
      color: var(--brand-text-muted); border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .shell-subnav button.on { color: var(--brand-text); border-bottom-color: var(--brand-primary-bright); }
    .shell-body { flex: 1; padding: 18px 20px; overflow: hidden; }
    .shell-body.flush { padding: 0; }
    .shell-bottom {
      display: flex; justify-content: space-around;
      padding: 8px 0 14px; border-top: 1px solid var(--brand-border);
    }
    .shell-bottom button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--brand-text-muted);
      font: 600 9px/1 "Plus Jakarta Sans", sans-serif; min-height: 44px;
    }
    .shell-bottom button.on { color: var(--brand-primary-bright); }
    .shell-bottom button.on::before {
      content: ""; position: absolute; top: -6px; width: 20px; height: 3px;
      border-radius: 2px; background: var(--brand-primary-bright); box-shadow: var(--glow);
    }
    .shell-bottom button { position: relative; }
    .shell-bottom .map-fab {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      display: grid; place-items: center; font-size: 16px; margin-top: -18px;
      box-shadow: var(--glow);
    }

    /* ── Uber widgets & placeholders ── */
    .widget-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
    .w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w6 { grid-column: span 6; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
    .uber-card {
      background: var(--brand-surface);
      border: 1px solid var(--brand-border);
      border-radius: var(--radius-card);
      padding: 18px 20px;
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--brand-primary-bright) 5%, transparent);
    }
    .uber-card-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .06em; color: var(--brand-text-muted); margin-bottom: 12px;
    }
    .uber-kpi { font-size: 48px; font-weight: 800; letter-spacing: -.06em; line-height: .95; color: var(--brand-text); }
    .uber-kpi-sm { font-size: 32px; font-weight: 800; letter-spacing: -.05em; }
    .uber-trend {
      display: inline-flex; margin-top: 10px; padding: 4px 10px;
      border-radius: var(--radius-pill); font-size: 10px; font-weight: 800;
      background: color-mix(in srgb, var(--brand-primary-bright) 18%, transparent);
      color: var(--brand-primary-bright); box-shadow: var(--glow);
    }
    .uber-chart {
      height: 140px; border-radius: 10px; position: relative; overflow: hidden;
      background: linear-gradient(180deg, color-mix(in srgb, var(--brand-primary-bright) 8%, transparent), transparent);
      border: 1px solid var(--brand-border);
    }
    .uber-chart svg { width: 100%; height: 100%; display: block; }
    .uber-chart-line {
      fill: none; stroke: var(--brand-primary-bright); stroke-width: 3; stroke-linecap: round;
      filter: drop-shadow(0 0 8px var(--brand-primary-bright));
    }
    .shift-carousel { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .shift-carousel::-webkit-scrollbar { display: none; }
    .shift-card-mini {
      flex: 0 0 200px; padding: 14px; border-radius: 14px;
      border: 1px solid var(--brand-border); background: var(--brand-elevated);
    }
    .shift-card-mini.hot { border-color: var(--brand-primary-bright); box-shadow: var(--glow); }
    .shift-card-mini .title { font-size: 13px; font-weight: 800; margin-top: 4px; }
    .shift-card-mini .pay { font-size: 16px; font-weight: 800; color: var(--brand-primary-bright); margin-top: 10px; }

    .sk { background: var(--brand-elevated); border-radius: 8px; border: 1px solid var(--brand-border); }
    .sk-line { height: 10px; border-radius: 4px; }
    .sk-line.w60 { width: 60%; } .sk-line.w40 { width: 40%; } .sk-line.w80 { width: 80%; } .sk-line.w30 { width: 30%; }
    .sk-card { padding: 14px; border-radius: var(--radius-card); border: 1px solid var(--brand-border); background: var(--brand-surface); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--brand-primary-bright) 4%, transparent); }
    .sk-grid { display: grid; gap: 12px; }
    .sk-grid.c2 { grid-template-columns: 1fr 1fr; }
    .sk-grid.c3 { grid-template-columns: repeat(3, 1fr); }
    .sk-grid.c4 { grid-template-columns: repeat(4, 1fr); }
    .sk-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--brand-border); }
    .sk-av { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .sk-stat { padding: 16px; text-align: center; }
    .sk-stat .num { font-size: 36px; font-weight: 800; color: var(--brand-text); margin-bottom: 4px; letter-spacing: -.04em; }
    .sk-stat .lbl { font-size: 10px; color: var(--brand-text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .sk-hero { padding: 40px 24px; text-align: center; }
    .sk-hero h3 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .sk-hero p { font-size: 13px; color: var(--brand-text-muted); max-width: 360px; margin: 0 auto 20px; }
    .sk-btn {
      display: inline-block; padding: 10px 20px; border-radius: var(--radius-pill);
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      font-size: 12px; font-weight: 800; border: none;
    }
    .sk-btn.outline { background: transparent; border: 1px solid var(--brand-border); color: var(--brand-text); }
    .sk-field { margin-bottom: 12px; }
    .sk-field .lbl { font-size: 10px; font-weight: 700; color: var(--brand-text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .sk-field .inp { height: 40px; width: 100%; }

    /* ── Map mock (shared) ── */
    .map-mock {
      position: relative; height: 100%; min-height: 540px;
      background:
        radial-gradient(ellipse 160px 100px at 55% 45%, color-mix(in srgb, var(--brand-primary-bright) 35%, transparent), transparent),
        radial-gradient(ellipse 90px 70px at 28% 35%, color-mix(in srgb, var(--brand-primary-bright) 16%, transparent), transparent),
        radial-gradient(ellipse 70px 50px at 78% 62%, color-mix(in srgb, var(--status-warning) 14%, transparent), transparent),
        #000;
    }
    .map-mock.tall { min-height: 620px; }
    .map-grid-bg {
      position: absolute; inset: 0; opacity: .1;
      background-image:
        linear-gradient(var(--brand-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--brand-border) 1px, transparent 1px);
      background-size: 44px 44px;
    }
    .map-road { position: absolute; background: #0c140c; opacity: .7; }
    .map-road.h { height: 2px; left: 0; right: 0; top: 46%; }
    .map-road.v { width: 2px; top: 8%; bottom: 8%; left: 42%; }
    .map-pin {
      position: absolute; width: 11px; height: 11px; border-radius: 50%;
      background: var(--brand-primary-bright); box-shadow: var(--glow);
    }
    .map-pin.warn { background: var(--status-warning); }
    .map-pin::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--brand-primary-bright) 35%, transparent);
    }
    .map-pulse {
      position: absolute; top: 44%; left: 54%;
      width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--brand-primary-bright) 28%, transparent), transparent 70%);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.12);opacity:.7} }
    .map-filter-bar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; gap: 6px; flex-wrap: wrap; z-index: 2;
    }
    .map-chip {
      padding: 7px 12px; border-radius: var(--radius-pill);
      border: 1px solid var(--brand-border); background: rgba(0,0,0,.8);
      font: 700 10px/1 "Plus Jakarta Sans", sans-serif; color: var(--brand-text-muted);
    }
    .map-chip.on { border-color: var(--brand-primary-bright); color: var(--brand-primary-bright); box-shadow: var(--glow); }
    .map-zoom {
      position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 2;
    }
    .map-zoom button {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(0,0,0,.85); border: 1px solid var(--brand-border);
      color: var(--brand-text); font-size: 16px;
    }
    .map-route-banner {
      position: absolute; top: 52px; left: 12px; right: 12px; z-index: 2;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(0,0,0,.88); border: 1px solid var(--brand-border);
      font-size: 11px; font-weight: 600;
    }
    .map-route-banner strong { color: var(--brand-primary-bright); }
    .map-dock {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      padding: 12px; display: flex; gap: 10px;
      overflow-x: auto; scrollbar-width: none;
      background: linear-gradient(transparent, rgba(0,0,0,.95) 35%);
    }
    .map-dock::-webkit-scrollbar { display: none; }
    .map-card {
      flex: 0 0 220px;
      padding: 14px 16px; border-radius: 14px;
      background: rgba(0,0,0,.9); border: 1px solid var(--brand-border);
      backdrop-filter: blur(12px);
    }
    .map-card.hot { border-color: color-mix(in srgb, var(--brand-primary-bright) 55%, var(--brand-border)); box-shadow: var(--glow-strong); }
    .map-card-title { font-size: 13px; font-weight: 800; }
    .map-card-sub { font-size: 10px; color: var(--brand-text-muted); margin-top: 3px; }
    .map-card-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .map-card-pay { font-size: 18px; font-weight: 800; color: var(--brand-primary-bright); }
    .map-card-btn {
      padding: 8px 14px; border-radius: var(--radius-pill);
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      border: none; font: 800 10px/1 "Plus Jakarta Sans", sans-serif;
    }
    .map-side-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 280px; z-index: 2;
      background: rgba(0,0,0,.94); border-left: 1px solid var(--brand-border);
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .map-fab-row { display: flex; gap: 8px; justify-content: flex-end; }
    .map-fab {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--brand-primary-bright); color: var(--brand-on-primary);
      border: none; font-size: 18px; box-shadow: var(--glow-strong);
    }
    .online-bar {
      padding: 12px 16px; border-top: 1px solid var(--brand-border);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,.95);
    }
    .online-toggle {
      width: 50px; height: 28px; border-radius: var(--radius-pill);
      background: var(--brand-primary-bright); box-shadow: var(--glow); position: relative;
    }
    .online-toggle::after {
      content: ""; position: absolute; top: 3px; right: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: var(--brand-on-primary);
    }

    /* ── Responsive index hide on mobile ── */
    @media (max-width: 900px) {
      .page-index { display: none; }
      .scroll-stage { padding: 12px 10px 60px; }
    }
    .device-frame.mobile .shell-sidebar { display: none; }
    .device-frame.mobile .map-side-panel { width: 100%; top: auto; height: 42%; border-left: none; border-top: 1px solid var(--brand-border); }

      ${mapBase(`
        <div class="map-filter-bar">
          ${['Open','Applied','Assigned','Active'].map((c,i) => `<span class="map-chip${i===0?' on':''}">${c}</span>`).join('')}
        </div>
        <div class="map-route-banner"><strong>Route</strong> · 12 min · 4.2 mi to selected job</div>
        <div class="map-dock">
          <div class="map-card hot">
            <div class="map-card-title">Event security · Downtown</div>
            <div class="map-card-sub">Tonight 6:00 PM · Surge 1.8×</div>
            <div class="map-card-row">
              <span class="map-card-pay">$42/hr</span>
              <button class="map-card-btn" type="button">Apply</button>
            </div>
          </div>
          <div class="map-card">
            <div class="map-card-title">Retail patrol</div>
            <div class="map-card-sub">Sat 10:00 AM · 2.4 mi</div>
            <div class="map-card-row">
              <span class="map-card-pay">$28/hr</span>
              <button class="map-card-btn" type="button">View</button>
            </div>
          </div>
        </div>`)}
    </div>
    <div class="online-bar">
      <div><div style="font-size:14px;font-weight:800">You're online</div><div style="font-size:10px;color:var(--brand-text-muted)">Accepting jobs</div></div>
      <div class="online-toggle"></div>
    </div>`;
  }

  function tplMapClient() {
    return `<div class="map-mock tall">
      ${mapBase(`
        <div class="map-filter-bar">
          ${['All','Live','Scheduled','Completed'].map((c,i) => `<span class="map-chip${i===1?' on':''}">${c}</span>`).join('')}
        </div>
        <div class="map-fab-row" style="position:absolute;top:52px;right:12px;z-index:2">
          <button class="map-fab" type="button" title="Post job">+</button>
        </div>
        <div class="map-dock">
          <div class="map-card hot">
            <div class="map-card-title">Live shift · Guard en route</div>
            <div class="map-card-sub">Staples Center · ETA 8 min</div>
            <div class="map-card-row">
              <span style="font-size:11px;font-weight:700;color:var(--brand-primary-bright)">Track →</span>
              <button class="map-card-btn" type="button">Chat</button>
            </div>
          </div>
        </div>`)}
    </div>`;
  }

  function tplMapStaff() {
    return `<div class="map-mock tall">
      ${mapBase(`
        <div class="map-filter-bar">
          ${['All jobs','Pending','Live','Needs review'].map((c,i) => `<span class="map-chip${i===0?' on':''}">${c}</span>`).join('')}
        </div>
        <div class="map-side-panel">
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-text-muted)">Selected job</div>
          <div class="map-card-title">Corporate lobby · Night shift</div>
          <div class="map-card-sub">Client: Acme Corp · 3 applicants</div>
          <div class="sk-row" style="border:none;padding:8px 0"><div class="sk sk-av" style="width:32px;height:32px"></div><div class="sk sk-line" style="flex:1"></div></div>
          <div class="sk-row" style="border:none;padding:8px 0"><div class="sk sk-av" style="width:32px;height:32px"></div><div class="sk sk-line" style="flex:1"></div></div>
          <div style="display:flex;gap:8px;margin-top:auto">
            <button class="map-card-btn" type="button" style="flex:1">Approve</button>
            <button class="sk-btn outline" type="button" style="flex:1;padding:8px">Deny</button>
          </div>
        </div>`)}
    </div>`;
  }

  const CONTENT = {
    landing: tplLanding,
    auth: () => tplAuth(false),
    'auth-signup': () => tplAuth(true),
    guide: tplGuide,
    legal: tplLegal,
    dashboard: tplDashboard,
    list: tplList,
    grid: tplGrid,
    form: tplForm,
    messages: tplMessages,
    profile: tplProfile,
    settings: tplSettings,
    calendar: tplCalendar,
    earnings: tplEarnings,
    activation: tplActivation,
    'map-guard': tplMapGuard,
    'map-client': tplMapClient,
    'map-staff': tplMapStaff,
  };

  function renderNav(layout, activeId) {
    const items = NAV[layout] || [];
    if (layout === 'staff') {
      return STAFF_GROUPS.map(g => {
        const groupItems = g.ids.map(id => items.find(it => it.id === id)).filter(Boolean);
        if (!groupItems.length) return '';
        return `<div class="shell-nav-group">
          <div class="shell-nav-group-title">${g.title}</div>
          ${groupItems.map(it => `
            <button type="button" class="${it.id === activeId ? 'on' : ''}">
              <span class="ico">${it.icon}</span><span>${it.label}</span>
            </button>`).join('')}
        </div>`;
      }).join('');
    }
    return items.map(it => `
      <button type="button" class="${it.id === activeId ? 'on' : ''}">
        <span class="ico">${it.icon}</span><span>${it.label}</span>
      </button>`).join('');
  }

  function renderUberTopbar(title) {
    return `<header class="uber-topbar">
      <span class="uber-market">Los Angeles ▾</span>
      <div class="uber-ticker"><strong>Surge</strong> — Downtown demand active · <strong>Traffic</strong> — I-405 delays</div>
      <div class="uber-top-actions">
        <span class="uber-bell">🔔<span class="uber-bell-badge">3</span></span>
        <span class="uber-greeting"><span>Hello</span> Alex,</span>
        <span class="uber-avatar"></span>
      </div>
    </header>`;
  }

  function renderSubnav(title) {
    const tabs = ['Overview', 'Details', 'Activity'];
    return `<nav class="shell-subnav">${tabs.map((t,i) =>
      `<button type="button" class="${i===0?'on':''}">${t}</button>`).join('')}</nav>`;
  }

  function renderSidebarExtra(layout) {
    if (layout === 'guard') {
      return `<div class="shell-status">
        <div class="shell-status-lbl">Status</div>
        <div class="shell-status-row"><span class="shell-status-dot"></span>Online · accepting</div>
      </div>`;
    }
    return '';
  }

  function renderBottomNav(layout, activeId) {
    const items = (NAV[layout] || []).filter(it => !['profile','settings','guide','preferences','payment-settings','integrations','dev-updates','permissions','audit-log','agreements','cities'].includes(it.id));
    const shown = items.slice(0, 4);
    return shown.map(it => {
      if (it.center) return `<button type="button" class="${it.id === activeId ? 'on' : ''}"><span class="map-fab">${it.icon}</span><span>${it.label}</span></button>`;
      return `<button type="button" class="${it.id === activeId ? 'on' : ''}">${it.icon}<span>${it.label}</span></button>`;
    }).join('') + `<button type="button">⋯<span>More</span></button>`;
  }

  function renderShell(page, inner) {
    const { layout, title, nav, type } = page;
    if (layout === 'public') {
      return `<div class="shell" style="min-height:560px"><div class="shell-main">
        <div class="uber-topbar"><span style="font-weight:800">Guardr</span><span style="font-size:11px;color:var(--brand-text-muted)">public</span></div>
        <div class="shell-body">${inner}</div></div></div>`;
    }
    const isMap = type.startsWith('map-');
    const showSubnav = ['dashboard', 'earnings', 'list'].includes(type) && !isMap;
    const mobile = FRAME.size === 'mobile';
    if (mobile) {
      return `<div class="shell mobile-stack">
        <div class="uber-topbar" style="padding:12px 16px"><span style="font-weight:800">${title}</span><span class="uber-avatar"></span></div>
        <div class="shell-body ${isMap ? 'flush' : ''}">${inner}</div>
        <div class="shell-bottom">${renderBottomNav(layout, nav)}</div>
      </div>`;
    }
    return `<div class="shell">
      <aside class="shell-sidebar">
        <div class="shell-brand"><span class="logo">G</span><span>${BRAND[layout]}</span></div>
        <nav class="shell-nav">${renderNav(layout, nav)}</nav>
        ${renderSidebarExtra(layout)}
      </aside>
      <div class="shell-main">
        ${renderUberTopbar(title)}
        ${showSubnav ? renderSubnav(title) : ''}
        <div class="shell-body ${isMap ? 'flush' : ''}">${inner}</div>
      </div>
    </div>`;
  }

  function renderPage(page) {
    const fn = CONTENT[page.type] || tplDashboard;
    const inner = fn();
    return `
      <section class="screen-block" id="${page.id}" data-role="${page.role}">
        <div class="screen-meta">
          <h2>${page.title}</h2>
          <span class="role-tag">${page.role}</span>
          <span class="path-tag">${page.path}</span>
        </div>
        <div class="device-frame ${FRAME.size}">${renderShell(page, inner)}</div>
      </section>`;
  }

  function filteredPages() {
    return FRAME.role === 'all' ? PAGES : PAGES.filter(p => p.role === FRAME.role);
  }

  function renderIndex() {
    const index = document.getElementById('page-index');
    const groups = ['public', 'client', 'guard', 'staff'];
    const groupsHtml = groups.map(role => {
      const pages = filteredPages().filter(p => p.role === role);
      if (!pages.length) return '';
      return `<div class="index-group" data-role="${role}">
        <div class="index-group-title">${role}</div>
        ${pages.map(p => `<button type="button" class="index-link" data-target="${p.id}">
          ${p.title}<span class="path">${p.path}</span>
        </button>`).join('')}
      </div>`;
    }).join('');
    const existingBrand = index.querySelector('.index-brand');
    if (!existingBrand) {
      index.innerHTML = `<div class="index-brand">
        <span class="logo">G</span>
        <div>Guardr preview<small>Design system mock</small></div>
      </div>` + groupsHtml;
    } else {
      index.querySelectorAll('.index-group').forEach(el => el.remove());
      index.insertAdjacentHTML('beforeend', groupsHtml);
    }

    index.querySelectorAll('.index-link').forEach(btn => {
      btn.onclick = () => {
        document.getElementById(btn.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  function renderStage() {
    document.getElementById('scroll-stage').innerHTML = filteredPages().map(renderPage).join('');
  }

  function render() {
    renderIndex();
    renderStage();
    setupScrollSpy();
  }

  function setupScrollSpy() {
    const blocks = document.querySelectorAll('.screen-block');
    const links = document.querySelectorAll('.index-link');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          links.forEach(l => l.classList.toggle('active', l.dataset.target === e.target.id));
        }
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    blocks.forEach(b => obs.observe(b));
  }

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      FRAME.role = btn.dataset.role;
      render();
    };
  });

  document.querySelectorAll('.frame-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      FRAME.size = btn.dataset.frame;
      render();
    };
  });

  render();
  </script>
</body>
</html>

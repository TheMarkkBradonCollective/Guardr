<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Guardr — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "Guardr Sans", "Inter Variable", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #000;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #b3b3b3; font-size: 15px; line-height: 1.4; }
      button {
        appearance: none;
        border: 0;
        background: #fff;
        color: #000;
        font-weight: 700;
        font-size: 15px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Guardr can’t reach the network right now. Reconnect and try again — your session is still saved.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5E7B61" />
    <meta name="description" content="Guardr — independent security staffing marketplace. Guards, clients, and staff operations on any device." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guardr" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://guardr.co/" />
    <meta property="og:url" content="https://guardr.co/" />
    <meta property="og:site_name" content="Guardr" />
    <meta property="og:title" content="Guardr — Security Staffing. On Demand." />
    <meta property="og:description" content="Connect with licensed security professionals for events, properties, construction sites, and long-term coverage." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Guardr — Independent Security Staffing. On Demand.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Guardr Service Worker Registered successfully:', reg.scope))
            .catch(err => console.error('Service Worker Registration failed:', err));
        });
      }
    </script>
  </body>
</html>

name = "guardr"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
account_id = "92d9592953c4d46474ae07993913f710"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "FILES"
bucket_name = "guardr-files"

[vars]
# Non-secret defaults only. Set secrets with `wrangler secret put`:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY
#   STRIPE_TEST_SECRET_KEY, STRIPE_TEST_WEBHOOK_SECRET, STRIPE_TEST_PUBLISHABLE_KEY
#   DATABASE_URL, JWT_SECRET, VAPID_* , CRON_SECRET, PUSH_INTERNAL_SECRET
# Stripe webhook (canonical): https://guardr.co/api/stripe/webhook
# Alternate: https://guardr.themarkkbrandoncollective-2d9.workers.dev/api/stripe/webhook
# See docs/STRIPE.md for subscribed event types.
APP_URL = "https://www.guardr.co"
VITE_APP_URL = "https://www.guardr.co"

[triggers]
crons = ["*/5 * * * *", "0 14 * * *"]

[build]
command = "npm run build"

# Branch previews do not inherit production settings. Keep file storage and
# absolute links off the live site and the production R2 bucket.
[previews.vars]
APP_URL = "https://cursor-visual-refresh-895e-guardr.themarkkbrandoncollective-2d9.workers.dev"
VITE_APP_URL = "https://cursor-visual-refresh-895e-guardr.themarkkbrandoncollective-2d9.workers.dev"

[[previews.r2_buckets]]
binding = "FILES"
bucket_name = "guardr-files-preview"

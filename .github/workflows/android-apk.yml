name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/build-android-apk.mjs'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync version manifests
        run: npm run generate:download-version

      - name: Write Firebase google-services.json
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set — APK push toggle will be disabled."
            echo "Add the full google-services.json from Firebase as a GitHub Actions secret, then re-run this workflow."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "
            const fs = require('fs');
            const json = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
            const pkg = json.client?.[0]?.client_info?.android_client_info?.package_name;
            if (pkg !== 'com.signaturesecurity.guardr') {
              console.error('::error::google-services.json package_name must be com.signaturesecurity.guardr, got', pkg);
              process.exit(1);
            }
            console.log('Firebase config OK for', pkg);
          "
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: APK parity audit (pre-build)
        run: npm run apk:audit
        continue-on-error: true

      - name: Build APK
        run: npm run android:apk
        env:
          VITE_APP_URL: https://www.guardr.co
          # Omit placeholder Supabase values — client falls back to production keys when unset/invalid.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: APK parity audit (post-build)
        run: npm run apk:audit

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardr-android-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            public/download/guardr.apk
          if-no-files-found: error

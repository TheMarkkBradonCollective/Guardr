name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/build-android-apk.mjs'
      - 'scripts/build-android-play.mjs'
      - 'scripts/build-android-release.mjs'
      - 'scripts/build-android-common.mjs'
      - 'scripts/write-google-services.mjs'
      - 'scripts/write-keystore.mjs'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync version manifests
        run: npm run generate:download-version

      - name: Write Firebase google-services.json
        run: node scripts/write-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: APK parity audit (pre-build)
        run: npm run apk:audit
        continue-on-error: true

      - name: Build APK
        run: npm run android:apk
        env:
          VITE_APP_URL: https://www.guardr.co
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: APK parity audit (post-build)
        run: npm run apk:audit

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardr-android-apk
          path: |
            android/app/build/outputs/apk/sideload/release/app-sideload-release.apk
            public/download/guardr.apk
          if-no-files-found: error

      - name: Write Play upload keystore
        run: node scripts/write-keystore.mjs
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build AAB
        if: env.ANDROID_KEYSTORE_READY == 'true'
        run: npm run android:aab
        env:
          VITE_APP_URL: https://www.guardr.co
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB artifact
        if: env.ANDROID_KEYSTORE_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guardr-android-aab
          path: |
            android/app/build/outputs/bundle/playRelease/app-play-release.aab
            dist/play-store/guardr-play-release.aab
          if-no-files-found: error

      - name: Note missing Play keystore
        if: env.ANDROID_KEYSTORE_READY != 'true'
        run: |
          echo "::warning::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set — APK was built but AAB was skipped."
          echo "Add Play upload keystore secrets to build and upload the AAB artifact."

    env:
      ANDROID_KEYSTORE_READY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}

apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = keystoreProperties['storeFile'] != null &&
        keystoreProperties['storePassword'] != null &&
        keystoreProperties['keyAlias'] != null &&
        keystoreProperties['keyPassword'] != null
}

android {
    namespace "com.signaturesecurity.guardr"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        def productApp = (findProperty('guardrProductApp') ?: '').toString().trim()
        def roleApplicationIds = [
            client: 'com.signaturesecurity.guardr.client',
            guard: 'com.signaturesecurity.guardr.guard',
            staff: 'com.signaturesecurity.guardr.staff',
            messenger: 'com.signaturesecurity.guardr.messenger',
        ]
        def roleLabels = [
            client: 'Customer',
            guard: 'Guard',
            staff: 'Staff',
            messenger: 'Messenger',
        ]
        applicationId (roleApplicationIds.containsKey(productApp)
            ? roleApplicationIds[productApp]
            : 'com.signaturesecurity.guardr')
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Keep in sync with package.json via npm run generate:download-version
        versionCode 232
        versionName "1.0.132-beta"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PRODUCT_APP", "\"${productApp}\""
        if (roleLabels.containsKey(productApp)) {
            resValue "string", "app_name", roleLabels[productApp]
            resValue "string", "title_activity_main", roleLabels[productApp]
            resValue "string", "package_name", roleApplicationIds[productApp]
            resValue "string", "custom_url_scheme", roleApplicationIds[productApp]
            resValue "color", "ic_launcher_background", productApp == 'staff' ? '#6B6B6B' : productApp == 'guard' ? '#FFFFFF' : '#000000'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        sideload {
            dimension 'distribution'
            // Sideload APKs for guardr.co/download — debug-signed (CI has no upload keystore).
            signingConfig signingConfigs.debug
        }
        play {
            dimension 'distribution'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

afterEvaluate {
    tasks.matching { it.name ==~ /.*(assemble|bundle)PlayRelease.*/ }.configureEach { task ->
        task.doFirst {
            if (!hasReleaseKeystore) {
                throw new GradleException(
                    'Play release requires android/keystore.properties — copy keystore.properties.example and add your upload keystore.'
                )
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
